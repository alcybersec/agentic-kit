# A worked agentic-kit profile, commented. Copy it to .claude/kit.yaml and edit, or let
# /kit-init write one for you by reading the repository.
#
# Every field is validated: a typo, an overlapping ownership map or a format command that
# carries its own target is refused with a message naming the field. Render it with
#   uv run --project "${CLAUDE_PLUGIN_ROOT}/kitgen" kitgen render \
#     --profile .claude/kit.yaml --out . --dry-run
# and read the output before running it without --dry-run.

kit_version: 1.10.5
rendered_on: "2026-10-03"        # a profile field, not the clock: the renderer is pure

project:
  name: Ledger
  slug: ledger                   # used in branch names and task IDs
  summary: Single-tenant bookkeeping API with a small web client.

forge:
  kind: gitlab                   # gitlab | github | none
  remote: "git@gitlab.example.com:acme/ledger.git"
  cli: glab                      # must match kind: gitlab->glab, github->gh, none->none
  ci: .gitlab-ci.yml             # where CI actually is, which need not be this forge
  exclusive: true                # block the other forge's CLI. NOT allowed when `ci`
                                 # belongs to the other forge: that would block the only
                                 # CLI able to read your pipeline
  mirror: null                   # a push-mirror that is not the tracker, e.g. github

attribution:
  mention_assistant_in_commits: false   # pre-bash-guard enforces this on commit messages

spine:
  # These paths are real configuration: the renderer emits here, not at fixed defaults.
  # Rename any of them if the default collides with a word your project already uses —
  # and update load_order to match, which `kitgen verify` checks.
  plan: docs/plan/README.md      # dispatch state. Generate-once: never re-rendered over
  strategy: docs/strategy.md     # the operating model: roles, floors, gates, task graph
  design: docs/design.md
  decisions: docs/decisions.md   # the ADR index
  risks: docs/risk-register.md
  contracts: docs/CONTRACTS.md   # owned by NO role on purpose: contract-first means the
                                 # implementing role records the contract
  inherited:                     # documents that already exist and are authoritative.
    - docs/PRD.md                # Checked on disk; never rendered or overwritten

load_order:
  - {path: docs/plan/README.md, mode: full}
  - {path: docs/strategy.md, mode: sections, sections: ["2", "3", "5", "6", "11"]}
  - {path: docs/decisions.md, mode: full}
  - {path: docs/risk-register.md, mode: full}
  - {path: docs/design.md, mode: on_demand}

milestones:
  prefix: M
  id_format: "{milestone}-S{sprint}-{OWNER}-{nnn}"
  outline:
    - {id: M0, name: Foundations}
    - {id: M1, name: "First vertical slice"}

roles:
  # Ownership is EXCLUSIVE and must not overlap: overlap is decided on literal directory
  # prefixes, so `app/**/*.py` against `app/**/*.tsx` is rejected — extension-partitioned
  # ownership of one tree is invalid by design. Leave anything no role should hold unowned;
  # an unowned path crosses nobody's boundary and that is what keeps the guard usable.
  # Eight roles is the ceiling (§8.4): each one costs a boundary and a handoff.
  - name: architect
    description: Contracts, ADRs, module boundaries.
    owns: ["docs/adr/**"]
    handoff_extra: []
    veto: false
    model: opus                  # judgement work: inherit | opus | sonnet | haiku | fable
    memory: project              # project | local. `user` is refused: one directory
                                 # shared across every repository would present a fact
                                 # about one codebase as true of another
  - name: backend
    description: API and services.
    owns: ["src/ledger/api/**", "src/ledger/services/**"]
    handoff_extra: []
    veto: false
    model: sonnet                # works against a contract that already exists
  - name: data
    description: Models, migrations, repositories.
    owns: ["src/ledger/models/**", "alembic/**"]
    handoff_extra: ["MIGRATION:", "PII COLUMNS:"]
    veto: false
    model: sonnet
  - name: devops
    description: Containers and CI.
    owns: ["docker/**", ".gitlab-ci.yml"]
    handoff_extra: ["SERVICES:", "RUNBOOK:"]
    veto: false
    model: sonnet
  - name: qa
    description: Integration and e2e tiers.
    # NOT `tests/**`: that would stop every other role writing a test, while the kit
    # mandates test-first. Leave tests/unit/** unowned.
    owns: ["tests/integration/**", "tests/e2e/**"]
    handoff_extra: ["COVERAGE DELTA:"]
    veto: false
    model: sonnet
  - name: safety
    description: Floors and threat model.
    owns: ["tests/safety/**", "docs/security/**"]
    handoff_extra: ["FLOOR DELTA:", "VETO:"]
    veto: true                   # exactly one role carries the veto
    model: opus                  # may not be `haiku`: an untested floor reads exactly
                                 # like a floor that holds

floors:
  # What must never regress. The veto role blocks a gate on these, so they come from you.
  - "no plaintext credentials in the tree"
  - "an authenticated endpoint never returns another tenant's rows"

critical:
  # Paths only the veto role may change, wherever they sit in the ownership map. For a file
  # that lives with the code that reads it but must not change without review.
  - src/ledger/services/kill_switch.py

test_tiers: {unit: 80, integration: 70, floor: 95}

toolchain:
  pm: uv
  test: "uv run pytest"
  format: "ruff format"          # must take ONE file: the post-edit hook appends the path,
                                 # so "ruff format ." would reformat the whole tree
  lint: "ruff check"
  types: mypy

secrets:
  # Root-anchored and matched whole, and they MUST start with "./" — the hooks and the
  # settings.json deny rules only agree on that form. Use "./**/.env" for a file that can
  # appear at more than one depth.
  - ./.env
  - ./secrets/**

observability: true              # instrument in paths your own role holds; a shared
                                 # registry is a CONTRACTS.md entry

usage:
  five_hour_pct: 0               # 0 = never pause: Claude Code continues an interrupted
                                 # task itself after a reset under 24 hours away
  seven_day_pct: 95              # pause here, because nothing auto-resumes a multi-day wait
  stale_after_s: 900
